---
layout: default
---
<article class="post">
  <h2>{{ page.title }}</h2>
  <p class="post-date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>

  <div class="post-content">
    {{ content }}
  </div>

  <nav class="post-navigation" aria-label="Post navigation">
    <div>
      {% if page.previous %}
        <span class="nav-label">Previous post</span>
        <a href="{{ page.previous.url | relative_url }}">{{ page.previous.title }}</a>
      {% endif %}
    </div>
    <div class="next-post">
      {% if page.next %}
        <span class="nav-label">Next post</span>
        <a href="{{ page.next.url | relative_url }}">{{ page.next.title }}</a>
      {% endif %}
    </div>
  </nav>

  <p><a href="{{ '/blog/' | relative_url }}">← All posts</a></p>
</article>
