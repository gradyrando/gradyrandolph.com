<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != "Home" %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <!-- RSS feed link intentionally disabled for now. Re-enable when you are ready to add RSS.
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }} RSS feed" href="{{ '/feed.xml' | relative_url }}">
  -->
</head>
<body>
  {% include header.html %}
  <div class="page-layout">
    <main>
      {{ content }}
      {% comment %} Newsletter signup intentionally disabled for now. Re-enable when ready.
      {% include newsletter.html %}
      {% endcomment %}
    </main>
    <aside class="sidebar">
      {% include sidebar.html %}
    </aside>
  </div>
  {% comment %}
    {% include footer.html %}
  {% endcomment %}
</body>
</html>
