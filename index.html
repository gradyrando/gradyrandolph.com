---
layout: default
title: Home
---

<img src="{{ '/assets/images/gradyswinging.jpeg' | relative_url }}"
     alt="A photo of Grady on a swing"
     class="profile-photo">

<h2>Posts</h2>

<ul class="post-list">
  {% for post in site.posts %}
    <li>
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
      <span class="post-date">— {{ post.date | date: "%B %-d, %Y" }}</span>
      {% if post.excerpt %}
        <div class="post-excerpt">{{ post.excerpt | strip_html | truncate: 180 }}</div>
      {% endif %}
    </li>
  {% endfor %}
</ul>
